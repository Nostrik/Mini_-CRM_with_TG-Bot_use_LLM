[project]
name = "mini-crm1-v"
version = "0.1.0"
package-mode = false
description = "vibecode-mini-crm"
authors = [
    {name = "Maksim"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "colorlog (>=6.12.0,<7.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "aiogram (>=3.31.0,<4.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "streamlit (>=1.64.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]
